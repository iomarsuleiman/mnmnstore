<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>MNMN Store</title>
<style>

.hero-text.enter .eyebrow,.hero-text.enter .hero-title,.hero-text.enter .hero-actions{animation:soft-in .55s ease both}.hero-text.enter .hero-title{animation-delay:.06s}.hero-text.enter .hero-actions{animation-delay:.12s}

.carousel-arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:39px;height:39px;border:1px solid #ffffff32;border-radius:50%;background:rgba(25,23,29,.24);color:#fff;display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 #ffffff12;opacity:.78;transition:opacity .2s,background .2s}.carousel-arrow:hover{opacity:1;background:#ffffff28}.carousel-arrow svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.carousel-arrow.prev{left:13px}.carousel-arrow.next{right:13px}.carousel-arrow[hidden]{display:none}

.content{max-width:1180px;margin:0 auto;padding:20px 0 95px}.sectionhead{padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 17px}.sectionhead h2{font-size:24px;letter-spacing:-.8px;font-weight:770;margin:0}

.card-target{width:100%;height:100%;padding:0;border:0;background:transparent;color:white;text-align:left;display:block}.rewardcard .cover{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:-2}.rewardcard:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#fff1 0%,transparent 22%,#0000 40%,#0004 63%,#000e 100%)}
.cardinfo{position:absolute;bottom:14px;left:14px;right:14px;pointer-events:none}.cardname{font-weight:760;font-size:19px;letter-spacing:-.5px;line-height:1.12;display:block;margin-bottom:7px}.cardprice{font-size:12px;color:#fff;opacity:.83;font-weight:600}

.footer{display:flex;justify-content:center;align-items:center;padding:26px 0 5px}.historylink{border:0;background:none;color:#aaa5b0;font-size:13px;font-weight:650;padding:12px}.historylink svg{vertical-align:middle;margin-right:6px;width:16px;height:16px}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end;justify-content:center;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}.overlay.open{display:flex}
.sheet{width:100%;max-width:580px;border-radius:29px 29px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:rgba(31,29,36,.94);border:1px solid #ffffff20;border-bottom:0;color:#fff;padding:10px 23px calc(26px + env(safe-area-inset-bottom));box-shadow:inset 0 1px 0 #ffffff13,0 -18px 70px #0006;backdrop-filter:blur(26px) saturate(125%);-webkit-backdrop-filter:blur(26px) saturate(125%);animation:slide .22s cubic-bezier(.18,.7,.2,1)}

.dismiss{border:1px solid #ffffff10;width:34px;height:34px;background:rgba(255,255,255,.11);border-radius:50%;color:#d4d0d8;font-size:23px;line-height:1}
.detailpic{position:relative;overflow:hidden;height:220px;background:#38313e;border-radius:17px;margin:3px 0 20px}.detailpic img{width:100%;height:100%;object-fit:cover}.detailpic .fallback{font-size:65px}.detailname{font-size:27px;font-weight:750;letter-spacing:-.9px;margin:0 0 4px}.muted{font-size:14px;color:#aaa4b0;line-height:1.45}.detailaction{display:flex;gap:10px;margin-top:22px}
.primary{border:0;border-radius:14px;background:#fafafa;color:#141316;min-height:52px;width:100%;font-size:15px;font-weight:740;padding:12px;transition:opacity .15s,transform .15s}.primary:active{transform:scale(.99)}.primary:disabled{background:#44414a;color:#ada6b2}
.subtlebtn{border:1px solid #ffffff13;border-radius:14px;background:rgba(255,255,255,.11);color:#fff;min-height:52px;min-width:88px;font-size:14px;font-weight:680;padding:0 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lbl{font-size:12px;color:#bbb6c2;font-weight:650;display:block;margin:17px 0 8px}.field{width:100%;border:1px solid #ffffff1c;border-radius:13px;background:rgba(255,255,255,.075);color:#fff;padding:14px 15px;min-height:50px;outline:none;font-size:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.field::placeholder{color:#898490}.field:focus{border-color:#c7b7d3}.error{min-height:18px;font-size:12px;color:#ff9f9f;margin:10px 0 0}

.filepick{position:relative;display:flex;gap:12px;align-items:center;border-radius:14px;background:rgba(255,255,255,.07);border:1px dashed #696470;padding:12px;cursor:pointer;font-size:14px;color:#d0cad6}.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.preview{width:67px;height:62px;border-radius:8px;background:linear-gradient(140deg,#655372,#342b40);overflow:hidden;display:grid;place-items:center;color:#c9bfd2;font-size:24px;flex:none}.preview img{height:100%;width:100%;object-fit:cover}.editrow{display:flex;justify-content:center;margin-top:18px}.danger{border:0;background:transparent;color:#ee9ca6;padding:12px;font-size:13px}
.activityrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 0;border-bottom:1px solid #39363e;font-size:15px}.activityrow small{display:block;color:#8d8895;font-size:12px;margin-top:5px}.activityrow strong{font-variant-numeric:tabular-nums}.empty{padding:35px 0;color:#96909d;text-align:center;font-size:14px}.finished{text-align:center;padding:22px 0}.finished .big{font-size:47px;margin-bottom:12px}.finished h3{font-size:24px;margin:0 0 6px;letter-spacing:-.7px}
.pin-flow{text-align:center;padding:10px 0 15px}.pin-icon{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid #ffffff19;color:#f3eafb;display:grid;place-items:center;font-size:29px;margin:0 auto 15px;box-shadow:inset 0 1px 0 #ffffff12}.pin-title{font-size:21px;font-weight:730;letter-spacing:-.5px;margin:0 0 7px}.pin-caption{font-size:14px;color:#a6a0ae;margin:0 auto 25px;line-height:1.4}.pin-wrap{position:relative;width:min(100%,326px);margin:0 auto 12px}
.pin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;width:100%;transition:transform .15s ease}.pin-slot{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1.5px solid #ffffff2a;border-radius:17px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 #ffffff12;transition:border-color .17s,background .17s,box-shadow .17s,transform .16s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.pin-slot.is-active{border-color:#ddd2ec;background:#ffffff15;box-shadow:0 0 0 3px #a39ab51a}.pin-slot.is-filled{border-color:#91869d;background:#ffffff18}
.pin-dot{width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transform:scale(.3);transition:opacity .12s,transform .16s cubic-bezier(.18,1.6,.42,1)}.pin-slot.is-filled .pin-dot{opacity:1;transform:scale(1)}.pin-slot.just-filled .pin-dot{animation:pop .24s cubic-bezier(.22,1.4,.42,1)}.pin-slot.is-active:not(.is-filled):after{content:"";position:absolute;width:2px;height:24px;border-radius:2px;background:#eee6f7;animation:blink .95s step-end infinite}.pin-input{position:absolute;inset:0;width:100%;height:100%;z-index:4;border:0;opacity:.015;color:transparent;background:transparent;caret-color:transparent;outline:none;font-size:18px;letter-spacing:25px;padding:0;cursor:text}
.pin-grid.is-wrong{animation:shake .43s cubic-bezier(.36,.07,.19,.97)}.pin-grid.is-wrong .pin-slot{background:#5a2930;border-color:#ff717f;box-shadow:0 0 0 2px #ff52621a}.pin-grid.is-wrong .pin-dot{background:#ffafb6}.pin-grid.is-success .pin-slot{background:#274439;border-color:#8de6af;box-shadow:0 0 0 2px #8de6af13}.pin-grid.is-success .pin-dot{background:#b1ffcc}
.pin-message{height:24px;font-size:13px;font-weight:590;color:#ff8996;margin:8px 0 6px;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}.pin-message.visible{opacity:1;transform:translateY(0)}.pin-message.success{color:#a0ebbd}.pin-tip{font-size:12px;color:#736d7a;margin:15px 0 0}
@keyframes pop{0%{transform:scale(.2)}65%{transform:scale(1.28)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}16%{transform:translateX(-9px)}32%{transform:translateX(8px)}48%{transform:translateX(-7px)}64%{transform:translateX(5px)}80%{transform:translateX(-3px)}}@keyframes blink{50%{opacity:0}}@keyframes slide{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}@keyframes soft-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:750px){.topbar{padding-top:34px;padding-left:38px;padding-right:38px}.hero{max-width:1180px;margin:13px auto 0;border-radius:26px;height:min(68vh,680px)}.content{padding-top:32px}.sectionhead{padding-left:2px;padding-right:2px}.rail{padding-left:2px;padding-right:2px;gap:17px}.overlay{align-items:center}.sheet{border-radius:27px}.hero-actions{gap:14px}.carousel-arrow.prev{left:23px}.carousel-arrow.next{right:23px}}
@media(max-width:390px){.hero-content{left:39px;right:39px}.hero-title{font-size:44px}.hero-actions{gap:7px}.pill{padding:0 16px}.glasspill{padding:13px 11px}.carousel-arrow{width:31px;height:31px}.carousel-arrow.prev{left:5px}.carousel-arrow.next{right:5px}}
@media(prefers-reduced-motion:reduce){.sheet,.pin-grid.is-wrong,.pin-slot.just-filled .pin-dot,.pin-slot.is-active:not(.is-filled):after,.hero-text.enter *{animation:none!important}.hero-image,.hero-fallback,.carousel-dot{transition:none!important}}
</style></head><body>
<header class="topbar"><div class="logo">mnmn<span> / store</span></div><div class="tools"><div class="balance" aria-label="Point balance"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><strong id="balance">6</strong><span>pts</span></div><button class="circle" id="addPoints" aria-label="Add points" title="Add points">+</button></div></header>
<main><section class="hero" id="hero" aria-label="Featured rewards carousel"><div class="hero-media" id="heroMedia"></div><button class="carousel-arrow prev" id="prevSlide" aria-label="Previous featured reward"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><button class="carousel-arrow next" id="nextSlide" aria-label="Next featured reward"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button><div class="hero-content"><div id="heroText" class="hero-text"></div><div class="carousel-dots" id="carouselDots" aria-label="Choose featured reward"></div></div></section>
<div class="content"><div class="sectionhead"><h2>Rewards</h2><button class="secondaryaction" id="newReward" aria-label="Add a reward"><span>＋</span> Add</button></div><div class="rail" id="cards" aria-label="Available rewards"></div><div class="footer"><button id="activity" class="historylink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>Activity</button></div></div></main>
<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="sheettop"><h2 id="sheetTitle"></h2><button class="dismiss" id="dismiss" aria-label="Close">×</button></div><div id="sheetBody"></div></section></div>
<script>
(function(){
'use strict';
const BAL='mnmn_store_balance_v1',HIST='mnmn_store_history_v1',PRODUCTS='mnmn_store_rewards_v2';
const API='https://mnmnstore-points-api.omaarsuliiman.workers.dev';
const defaults=[
{id:'date',name:'Date together',price:15,image:'https://images.unsplash.com/photo-1775653619082-3cf33d9ae07b?auto=format&fit=crop&w=1500&q=82'},
{id:'photo',name:'One-time photo',price:1,image:'https://images.unsplash.com/photo-1769266289377-37399fd0673f?auto=format&fit=crop&w=900&q=80'},
{id:'video',name:'Video',price:3,image:'https://images.unsplash.com/photo-1582874007327-42d7cf9d6a1d?auto=format&fit=crop&w=900&q=80'},
{id:'voice',name:'Voice note',price:.5,image:'https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=900&q=80'},
{id:'call',name:'Call',price:5,image:'https://images.unsplash.com/photo-1763296556896-5b17f1414525?auto=format&fit=crop&w=900&q=80'}
];
const el=id=>document.getElementById(id),fmt=n=>Number.isInteger(n)?String(n):Number(n).toFixed(1);
let balance=6,history=[],products=defaults.map(p=>({...p})),currentSlide=0,autoTimer=null,fadeTimer=null;
// Balance comes from the shared server.
// History comes from the shared server.
try{const p=JSON.parse(localStorage.getItem(PRODUCTS)||'null');if(Array.isArray(p))products=p.filter(v=>v&&typeof v.id==='string'&&typeof v.name==='string'&&Number.isFinite(v.price)&&v.price>0).slice(0,70)}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pencil='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-.8 4.8L8 20l11.4-11.4a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m14.5 7.5 3 3"/></svg>';
function safeImage(s){if(typeof s!=='string')return '';if(/^https:\/\//i.test(s))return s;if(/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(s))return s;return ''}
function imageHTML(p,cls){const url=safeImage(p.image);return url?'<img class="'+(cls||'')+'" src="'+esc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div class="fallback">♡</div>'}
function saveBalance(){el('balance').textContent=fmt(balance)}
function saveProducts(next){try{localStorage.setItem(PRODUCTS,JSON.stringify(next));products=next;return true}catch(e){return false}}
function record(name,delta){history.unshift({title:name,diff:delta,date:new Date().toISOString()});history=history.slice(0,80)}
function setHeroSlide(index,initial){
const media=el('heroMedia'),content=el('heroText'),dots=el('carouselDots');
if(!products.length){media.innerHTML='';content.innerHTML='<div class="eyebrow">MNMN STORE</div><h1 class="hero-title">For you.</h1>';dots.innerHTML='';el('prevSlide').hidden=true;el('nextSlide').hidden=true;return}
const old=currentSlide;currentSlide=(index+products.length)%products.length;
const p=products[currentSlide],img=safeImage(p.image);
if(initial){media.innerHTML='';}
if(initial||old!==currentSlide){
for(const prev of media.children)prev.classList.remove('active');
const layer=document.createElement(img?'img':'div');
layer.className=(img?'hero-image':'hero-fallback');
if(img){layer.src=img;layer.alt='';layer.referrerPolicy='no-referrer';}else layer.textContent='♡';
media.appendChild(layer);
requestAnimationFrame(()=>layer.classList.add('active'));
clearTimeout(fadeTimer);
fadeTimer=setTimeout(()=>{for(const oldLayer of Array.from(media.children)){if(oldLayer!==layer)oldLayer.remove()}},900);
}
content.classList.remove('enter');void content.offsetWidth;
content.innerHTML='<div class="eyebrow">FEATURED REWARD</div><h1 class="hero-title">'+esc(p.name)+'</h1><div class="hero-actions"><button class="pill" id="openFeature">View reward</button><span class="glasspill">'+fmt(p.price)+' '+(p.price===1?'pt':'pts')+'</span><button class="edit-feature" id="editFeature" aria-label="Edit '+esc(p.name)+'" title="Edit reward">'+pencil+'</button></div>';
content.classList.add('enter');
el('openFeature').onclick=()=>viewReward(p.id);el('editFeature').onclick=()=>rewardForm(p.id);
dots.innerHTML=products.length>1?products.map((v,i)=>'<button class="carousel-dot'+(i===currentSlide?' active':'')+'" data-slide="'+i+'" aria-label="Show '+esc(v.name)+'" aria-current="'+(i===currentSlide?'true':'false')+'"></button>').join(''):'';
const controls=products.length>1;el('prevSlide').hidden=!controls;el('nextSlide').hidden=!controls;
}
function advance(delta){if(products.length<2)return;setHeroSlide(currentSlide+delta,false);resetAuto()}
function resetAuto(){clearInterval(autoTimer);if(products.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)autoTimer=setInterval(()=>{if(!document.hidden&&!el('overlay').classList.contains('open'))setHeroSlide(currentSlide+1,false)},6200)}
el('prevSlide').onclick=()=>advance(-1);el('nextSlide').onclick=()=>advance(1);
el('carouselDots').onclick=e=>{const button=e.target.closest('[data-slide]');if(button){setHeroSlide(Number(button.dataset.slide),false);resetAuto()}};
let swipeX=null,swipeY=null;
el('hero').addEventListener('touchstart',e=>{if(!e.touches.length)return;swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY},{passive:true});
el('hero').addEventListener('touchend',e=>{if(swipeX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;swipeX=null;swipeY=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25)advance(dx<0?1:-1)},{passive:true});
el('hero').addEventListener('keydown',e=>{if(e.target!==el('hero'))return;if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1)});
function draw(){
saveBalance();
currentSlide=Math.max(0,Math.min(currentSlide,Math.max(0,products.length-1)));
setHeroSlide(currentSlide,true);
const other=products.slice(1);
el('cards').innerHTML=other.map(p=>'<article class="rewardcard"><button class="card-target" data-view="'+esc(p.id)+'" aria-label="View '+esc(p.name)+'">'+imageHTML(p,'cover')+'<div class="cardinfo"><span class="cardname">'+esc(p.name)+'</span><span class="cardprice">'+fmt(p.price)+' '+(p.price===1?'point':'points')+'</span></div></button><button class="card-edit" data-edit="'+esc(p.id)+'" title="Edit reward" aria-label="Edit '+esc(p.name)+'">'+pencil+'</button></article>').join('');
resetAuto();
}
function open(title,content){el('sheetTitle').textContent=title;el('sheetBody').innerHTML=content;el('overlay').classList.add('open');document.body.style.overflow='hidden'}
function close(){el('overlay').classList.remove('open');document.body.style.overflow=''}
el('dismiss').onclick=close;el('overlay').onclick=e=>{if(e.target===el('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
el('cards').onclick=e=>{const edit=e.target.closest('[data-edit]'),view=e.target.closest('[data-view]');if(edit)rewardForm(edit.dataset.edit);else if(view)viewReward(view.dataset.view)};
async function api(path,data){
 const r=await fetch(API+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});
 const response=await r.json().catch(()=>({error:'Server unavailable'}));
 if(!r.ok)throw Error(response.error||'Server unavailable');return response;
}
let lastRevision=-1,loadingShared=false;
async function syncShared(){if(loadingShared)return;loadingShared=true;try{const data=await api('/state');if(lastRevision!==data.revision){lastRevision=data.revision;balance=data.balance;history=data.history;draw()}}finally{loadingShared=false}}
async function changeScore(points,title,pin){const data=await api('/change',{deltaHalf:Math.round(points*2),title,pin});lastRevision=data.revision;balance=data.balance;history=data.history;draw()}
async function pinOK(pin){try{await api('/verify',{pin});return true}catch{return false}}
function resetPin(onReset){
 open('Reset PIN','<p class="muted">Enter your recovery word to choose a new approval PIN.</p><label class="lbl" for="recoveryWord">Recovery word</label><input class="field" id="recoveryWord" type="password" autocomplete="off" placeholder="Recovery word"><label class="lbl" for="replacementPin">New 4-digit PIN</label><input class="field" id="replacementPin" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000"><div id="resetError" class="pin-message" role="status"></div><button class="primary" style="margin-top:18px" id="finishReset">Reset PIN</button><button class="subtlebtn" id="resetBack" style="margin-top:10px">Back</button>');
 el('resetBack').onclick=onReset;
 el('finishReset').onclick=async()=>{
  const recoveryWord=el('recoveryWord').value,newPin=el('replacementPin').value.trim(),btn=el('finishReset');
  if(!/^[0-9]{4}$/.test(newPin)){el('resetError').textContent='Enter exactly four digits';el('resetError').classList.add('visible');return}
  btn.disabled=true;
  try{await api('/reset-pin',{recoveryWord,newPin});open('PIN updated','<p class="muted">Your new PIN is ready on both devices.</p><button class="primary" id="pinDone">Continue</button>');el('pinDone').onclick=onReset}
  catch(e){el('resetError').textContent=e.message;el('resetError').classList.add('visible');btn.disabled=false}
 };
}
function requestPin(onSuccess,returnTo){
open('Approval','<div class="pin-flow"><div class="pin-icon" aria-hidden="true">♡</div><h3 class="pin-title">Her approval</h3><p class="pin-caption">Enter the 4-digit PIN</p><div class="pin-wrap" id="pinWrap"><div class="pin-grid" id="pinGrid">'+Array(4).fill('<div class="pin-slot"><span class="pin-dot"></span></div>').join('')+'</div><input class="pin-input" id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4" aria-label="Four digit approval PIN"></div><div id="pinMessage" class="pin-message" role="status" aria-live="polite"></div><div class="pin-tip">Only she knows the PIN</div><button class="subtlebtn" id="forgotPin" style="width:100%;margin-top:12px">Forgot PIN? Use recovery word</button></div><button class="subtlebtn" id="pinBack" style="width:100%;margin-top:14px">Back</button>');
const input=el('pinInput'),grid=el('pinGrid'),slots=Array.from(grid.children),msg=el('pinMessage');let locked=false,lastLength=0;
el('pinBack').onclick=()=>{if(returnTo)returnTo();else close()};el('forgotPin').onclick=()=>resetPin(()=>requestPin(onSuccess,returnTo));
function paint(v){slots.forEach((slot,i)=>{slot.classList.toggle('is-filled',i<v.length);slot.classList.toggle('is-active',i===v.length&&v.length<4&&!locked);slot.classList.remove('just-filled')});if(v.length>lastLength&&v.length>0){const slot=slots[v.length-1];void slot.offsetWidth;slot.classList.add('just-filled')}lastLength=v.length}
input.addEventListener('input',async function(){if(locked)return;const v=input.value.replace(/[^0-9]/g,'').slice(0,4);if(input.value!==v)input.value=v;paint(v);msg.className='pin-message';msg.textContent='';if(v.length!==4)return;locked=true;paint(v);const good=await pinOK(v).catch(()=>false);if(el('pinGrid')!==grid)return;
if(good){grid.classList.add('is-success');msg.textContent='Approved';msg.className='pin-message visible success';if(navigator.vibrate)navigator.vibrate(15);setTimeout(()=>{if(el('pinGrid')!==grid)return;onSuccess(v)},340)}
else{grid.classList.add('is-wrong');msg.textContent='Incorrect PIN. Try again.';msg.className='pin-message visible';if(navigator.vibrate)navigator.vibrate([35,45,35]);setTimeout(()=>{if(el('pinGrid')!==grid)return;input.value='';locked=false;lastLength=0;grid.classList.remove('is-wrong');paint('');input.focus({preventScroll:true})},650)}});
const focus=()=>{if(!locked)input.focus({preventScroll:true})};grid.addEventListener('click',focus);setTimeout(()=>{if(el('pinInput')===input)focus()},240)}
function viewReward(id){const p=products.find(v=>v.id===id);if(!p)return;const enough=balance>=p.price;
open('Reward','<div class="detailpic">'+imageHTML(p,'')+'</div><h3 class="detailname">'+esc(p.name)+'</h3><div class="muted">'+fmt(p.price)+' '+(p.price===1?'point':'points')+'</div><div class="detailaction"><button class="primary" id="redeem" '+(enough?'':'disabled')+'>'+(enough?'Redeem':'Need '+fmt(p.price-balance)+' more points')+'</button><button class="subtlebtn" id="edit">Edit</button></div>');
el('edit').onclick=()=>rewardForm(p.id);el('redeem').onclick=()=>requestPin(async pin=>{
 try{await changeScore(-p.price,p.name,pin);open('Redeemed','<div class="finished"><div class="big">♡</div><h3>'+esc(p.name)+'</h3><p class="muted">Redeemed for '+fmt(p.price)+' points</p></div><button class="primary" id="done">Done</button>');el('done').onclick=close}
 catch(e){open('Could not redeem','<p class="muted" id="redeemError"></p><button class="primary" id="redeemBack">Back</button>');el('redeemError').textContent=e.message;el('redeemBack').onclick=()=>viewReward(id)}
 },()=>viewReward(id))}
el('addPoints').onclick=()=>{let amount=1;function pointsForm(){open('Add points','<div class="stepper"><strong class="steppoints" id="amount">'+fmt(amount)+'</strong><div class="stepbuttons"><button id="minus" aria-label="Subtract half a point">−</button><button id="plus" aria-label="Add half a point">+</button></div></div><p class="muted">Approval required</p><button class="primary" id="confirmPoints" style="margin-top:18px">Continue</button>');
function redraw(){el('amount').textContent=fmt(amount);el('minus').disabled=amount<=.5}
el('minus').onclick=()=>{amount=Math.max(.5,amount-.5);redraw()};el('plus').onclick=()=>{amount=Math.min(1000,amount+.5);redraw()};
el('confirmPoints').onclick=()=>requestPin(async pin=>{
 try{await changeScore(amount,'Points added',pin);close()}
 catch(e){open('Could not add points','<p class="muted" id="addError"></p><button class="primary" id="addBack">Back</button>');el('addError').textContent=e.message;el('addBack').onclick=pointsForm}
 },pointsForm);redraw()}pointsForm()};
function rewardForm(id){const existing=id?products.find(p=>p.id===id):null;if(id&&!existing)return;
const draft={name:existing?existing.name:'',price:existing?fmt(existing.price):'',image:existing?existing.image||'':''};
function editor(){
open(existing?'Edit reward':'New reward','<label class="lbl" for="rewardName">Name</label><input id="rewardName" class="field" maxlength="54" placeholder="Reward name" value="'+esc(draft.name)+'"><label class="lbl" for="rewardPrice">Points</label><input id="rewardPrice" class="field" type="number" min="0.5" max="1000" step="0.5" inputmode="decimal" placeholder="1" value="'+esc(draft.price)+'"><label class="lbl">Cover image</label><label class="filepick"><span class="preview" id="preview">＋</span><span>Choose photo</span><input id="upload" type="file" accept="image/*"></label><label class="lbl" for="imageUrl">Or image URL</label><input id="imageUrl" class="field" type="url" placeholder="https://" value="'+(draft.image&&!String(draft.image).startsWith('data:')?esc(draft.image):'')+'"><div class="error" id="error"></div><button class="primary" id="saveReward">'+(existing?'Save changes':'Add reward')+'</button>'+(existing?'<div class="editrow"><button class="danger" id="deleteReward">Remove reward</button></div>':''));
const nameInput=el('rewardName'),priceInput=el('rewardPrice'),urlInput=el('imageUrl'),error=el('error');const err=msg=>{if(el('error')===error)error.textContent=msg};
function snapshot(){draft.name=nameInput.value;draft.price=priceInput.value}nameInput.oninput=snapshot;priceInput.oninput=snapshot;
function preview(){const div=el('preview'),src=safeImage(draft.image);if(div)div.innerHTML=src?'<img alt="Selected cover" src="'+esc(src)+'">':'＋'}preview();
urlInput.oninput=()=>{draft.image=urlInput.value.trim();preview()};
el('upload').onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>20*1024*1024){err('Choose an image under 20 MB');return}try{draft.image=await compressImage(file);urlInput.value='';preview();err('')}catch(e){err('Could not open this photo')}};
el('saveReward').onclick=()=>{
snapshot();const name=draft.name.trim(),price=Number(draft.price);
if(!name){err('Enter a name');return}if(draft.price.trim()===''||!Number.isFinite(price)||price<.5||price>1000||Math.abs(price*2-Math.round(price*2))>.00001){err('Use points in 0.5 increments');return}
if(draft.image&&!safeImage(draft.image)){err('Use an HTTPS image URL or upload a photo');return}
const product={id:existing?existing.id:'reward-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*10000).toString(36),name,price,image:draft.image||''};
requestPin(()=>{const next=existing?products.map(p=>p.id===existing.id?product:p):[...products,product];
if(!saveProducts(next)){open('Could not save','<p class="muted">The image may be too large for this browser.</p><button class="primary" id="goBack">Back</button>');el('goBack').onclick=editor;return}
draw();close()},editor)};
if(existing)el('deleteReward').onclick=()=>{snapshot();requestPin(()=>{const next=products.filter(p=>p.id!==existing.id);if(saveProducts(next)){currentSlide=0;draw();close()}else{open('Could not save','<p class="muted">Please try again.</p><button class="primary" id="goBack">Back</button>');el('goBack').onclick=editor}},editor)};
}editor()}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx){reject(new Error('canvas'));return}ctx.fillStyle='#151318';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.76))};img.src=reader.result};reader.readAsDataURL(file)})}
el('newReward').onclick=()=>rewardForm();el('activity').onclick=()=>{const rows=history.length?history.map(h=>'<div class="activityrow"><div><strong>'+esc(h.title)+'</strong><small>'+new Date(h.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</small></div><strong>'+(h.diff>0?'+':'')+fmt(Number(h.diff))+'</strong></div>').join(''):'<div class="empty">No activity yet</div>';open('Activity',rows)};
draw();syncShared().catch(()=>{el('balance').textContent='—'});setInterval(()=>{if(document.visibilityState==='visible')syncShared().catch(()=>{})},3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncShared().catch(()=>{})});
})();
</script></body></html>
